name: User story
description: Νέα λειτουργία από τη σκοπιά του χρήστη
title: "[US-XX] "
labels: ["type:story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Ως <ρόλος> θέλω <λειτουργία> ώστε <όφελος>
      placeholder: Ως παίκτης θέλω ... ώστε ...
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Acceptance criteria
      description: Ελέγξιμα κριτήρια· το καθένα πρέπει να καλύπτεται από test
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Story points
      options: ["1", "2", "3", "5", "8", "13"]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Προτεραιότητα (MoSCoW)
      options: ["Must", "Should", "Could", "Won't"]
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner / Reviewer
      placeholder: "@owner / @reviewer"
  - type: textarea
    id: tests
    attributes:
      label: Απαιτούμενοι έλεγχοι
